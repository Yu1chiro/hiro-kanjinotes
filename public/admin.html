<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome Hiro</title>
    <link rel="shortcut icon" href="https://ik.imagekit.io/yuidev25/Hera?updatedAt=1781458984059" type="image/x-icon">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style> body { font-family: "Poppins", sans-serif; } </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 pb-24 md:pb-12">

    <div id="custom-toast" class="fixed top-5 left-1/2 -translate-x-1/2 z-[200] max-w-sm w-11/12 hidden transition-all duration-300 transform -translate-y-5 opacity-0">
        <div id="toast-bg" class="px-5 py-4 rounded-2xl shadow-xl border flex items-center gap-3">
            <span id="toast-icon" class="text-xl"></span>
            <p id="toast-message" class="text-xs font-semibold tracking-wide"></p>
        </div>
    </div>

    <div id="confirm-modal" class="fixed inset-0 z-[190] bg-slate-900/50 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-[2rem] p-6 max-w-sm w-full shadow-2xl border border-slate-100 transform transition-all scale-95 opacity-0 duration-200" id="confirm-box">
            <h4 class="text-base font-bold text-slate-800" id="confirm-title">Konfirmasi Aksi</h4>
            <p class="text-xs text-slate-400 mt-2 leading-relaxed" id="confirm-msg">Apakah Anda yakin?</p>
            <div class="flex gap-3 mt-6">
                <button id="confirm-cancel-btn" class="flex-grow bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold py-3 rounded-xl text-xs uppercase tracking-wider transition-all">Batal</button>
                <button id="confirm-ok-btn" class="flex-grow bg-rose-600 hover:bg-rose-700 text-white font-bold py-3 rounded-xl text-xs uppercase tracking-wider transition-all shadow-lg shadow-rose-600/10">Hapus</button>
            </div>
        </div>
    </div>

    <div id="edit-deck-modal" class="fixed inset-0 z-[180] bg-slate-900/50 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-[2rem] p-6 max-w-sm w-full shadow-2xl border border-slate-100">
            <h4 class="text-base font-bold text-slate-800">Ubah Nama Deck</h4>
            <input type="hidden" id="edit-deck-id">
            <input type="text" id="edit-deck-name" class="w-full bg-slate-50 border border-slate-200 p-3 rounded-xl mt-4 focus:border-sky-500 outline-none transition-all text-sm font-medium" required>
            <div class="flex gap-3 mt-5">
                <button onclick="closeEditDeckModal()" class="flex-grow bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold py-3 rounded-xl text-xs uppercase transition-all">Batal</button>
                <button onclick="submitUpdateDeck()" class="flex-grow bg-sky-600 hover:bg-sky-700 text-white font-bold py-3 rounded-xl text-xs uppercase transition-all">Simpan</button>
            </div>
        </div>
    </div>

    <nav class="bg-white border-b border-slate-100 sticky top-0 z-50">
        <div class="container mx-auto px-4 py-4 max-w-5xl flex justify-between items-center">
            <div class="flex items-center gap-2">
                <img src="https://ik.imagekit.io/yuidev25/Hera?updatedAt=1781458984059" class="w-10 h-auto" alt="">
                <span class="text-sm font-black text-slate-800 tracking-tight uppercase">おかえり！</span>
            </div>
            <div class="hidden md:flex items-center gap-3">
                <a href="/" class="text-xs font-bold text-sky-600 hover:text-sky-800 uppercase tracking-wider bg-sky-50 px-4 py-2 rounded-xl transition-all"><i class="fas fa-play mr-1"></i> Mode Belajar</a>
                <button onclick="logout()" class="text-xs font-bold text-rose-600 hover:bg-rose-50 px-4 py-2 rounded-xl transition-all"><i class="fas fa-sign-out-alt mr-1"></i> Logout</button>
            </div>
        </div>
    </nav>

    <div class="container mx-auto p-4 max-w-5xl mt-4">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 items-start">
            
            <div class="bg-white p-5 rounded-[2rem] border border-slate-100 shadow-sm space-y-4">
                <div class="border-b border-slate-50 pb-2">
                    <h3 class="text-sm font-bold text-slate-800 uppercase tracking-wider"><i class="fas fa-folder-open text-sky-500 mr-2"></i>Koleksi Decks</h3>
                    <p class="text-[11px] text-slate-400 mt-1">Pilih deck untuk melihat dan menambah isinya.</p>
                </div>
                <form id="deck-form" class="flex gap-2">
                    <input type="text" id="deck-name" placeholder="Buat deck baru..." class="flex-grow bg-slate-50 border border-slate-200 p-3 rounded-xl focus:border-sky-500 outline-none transition-all text-xs font-medium" required>
                    <button type="submit" class="bg-slate-800 hover:bg-black text-white px-4 rounded-xl font-bold text-sm transition-all shadow-md active:scale-95"><i class="fas fa-plus"></i></button>
                </form>
                <div id="decks-list" class="space-y-2 max-h-72 overflow-y-auto pr-1"></div>
            </div>

            <div class="lg:col-span-2 space-y-6">
                
                <div class="bg-white p-5 rounded-[2rem] border border-slate-100 shadow-sm">
                    <div class="border-b border-slate-50 pb-2 mb-4 flex justify-between items-center">
                        <div>
                            <h3 id="card-form-title" class="text-sm font-bold text-slate-800 uppercase tracking-wider"><i class="fas fa-clone text-emerald-500 mr-2"></i>Tambah Kartu Baru</h3>
                            <p class="text-[11px] text-slate-400 mt-1" id="card-form-subtitle">Ke dalam <span class="font-bold text-sky-600" id="current-deck-label">Semua Deck</span></p>
                        </div>
                        <button id="cancel-edit-card-btn" onclick="resetCardFormState()" class="hidden bg-slate-100 text-slate-600 font-bold px-3 py-1.5 rounded-xl text-[10px] uppercase transition-all hover:bg-slate-200"><i class="fas fa-times mr-1"></i> Batal Edit</button>
                    </div>
                    <form id="card-form" class="grid grid-cols-2 gap-4">
                        <input type="hidden" id="card-edit-id">
                        <div class="col-span-2 sm:col-span-1">
                            <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-1 ml-1">Pilih Wadah Deck</label>
                            <select id="card-deck-id" class="w-full bg-slate-50 border border-slate-200 p-3 rounded-xl text-xs outline-none focus:border-sky-500 font-medium" required></select>
                        </div>
                        <div class="col-span-2 sm:col-span-1">
                            <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-1 ml-1">Karakter Kanji</label>
                            <input type="text" id="card-kanji" placeholder="Ex: 読む" class="w-full bg-slate-50 border border-slate-200 p-3 rounded-xl text-xs outline-none focus:border-sky-500 font-medium" required>
                        </div>
                        <div class="col-span-2 sm:col-span-1">
                            <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-1 ml-1">Furigana / Cara Baca</label>
                            <input type="text" id="card-furigana" placeholder="Ex: よむ" class="w-full bg-slate-50 border border-slate-200 p-3 rounded-xl text-xs outline-none focus:border-sky-500 font-medium" required>
                        </div>
                        <div class="col-span-2 sm:col-span-1">
                            <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-1 ml-1">Arti Kosakata</label>
                            <input type="text" id="card-meaning" placeholder="Ex: Membaca" class="w-full bg-slate-50 border border-slate-200 p-3 rounded-xl text-xs outline-none focus:border-sky-500 font-medium" required>
                        </div>
                        <button type="submit" id="card-submit-btn" class="col-span-2 bg-emerald-600 hover:bg-emerald-700 active:scale-[0.99] text-white font-bold py-3.5 rounded-xl text-xs tracking-wider uppercase transition-all shadow-md mt-2">
                            <i class="fas fa-save mr-2"></i> Simpan Kartu
                        </button>
                    </form>
                </div>

                <div class="bg-white p-5 rounded-[2rem] border border-slate-100 shadow-sm" id="cards-section">
                    
                    <div class="border-b border-slate-50 pb-3 mb-4 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                        <div>
                            <h3 class="text-sm font-bold text-slate-800 uppercase tracking-wider">
                                <i class="fas fa-list-ul text-sky-500 mr-2"></i><span id="cards-table-title">Isi Deck: Semua</span>
                            </h3>
                        </div>
                        <div class="w-full sm:w-auto flex items-center bg-slate-50 border border-slate-200 rounded-xl px-2">
                            <i class="fas fa-filter text-slate-400 text-xs ml-2"></i>
                            <select id="table-deck-filter" onchange="filterDeckBy(this.value ? parseInt(this.value) : null)" class="w-full bg-transparent p-2 text-xs outline-none focus:ring-0 font-medium text-slate-600 cursor-pointer">
                                <option value="">🌟 Tampilkan Semua Deck</option>
                            </select>
                        </div>
                    </div>

                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse min-w-[600px]">
                            <thead>
                                <tr class="bg-slate-50 text-slate-400 text-[10px] font-bold uppercase tracking-wider border-b border-slate-100">
                                    <th class="p-3 rounded-tl-lg">Deck</th>
                                    <th class="p-3">Kanji</th>
                                    <th class="p-3">Furigana</th>
                                    <th class="p-3">Arti Utama</th>
                                    <th class="p-3 text-center rounded-tr-lg">Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="cards-table-body" class="text-xs divide-y divide-slate-100 font-medium"></tbody>
                        </table>
                    </div>

                    <div class="flex flex-col sm:flex-row justify-between items-center mt-5 px-2 gap-4">
                        <span class="text-[11px] text-slate-500 font-medium" id="pagination-info">Menampilkan 0 dari 0 data</span>
                        <div class="flex gap-2">
                            <button onclick="prevPage()" id="prev-btn" class="px-4 py-2 bg-slate-100 text-slate-600 rounded-xl text-[11px] font-bold hover:bg-slate-200 disabled:opacity-50 disabled:cursor-not-allowed transition-all uppercase tracking-wider shadow-sm">Prev</button>
                            <button onclick="nextPage()" id="next-btn" class="px-4 py-2 bg-sky-100 text-sky-600 rounded-xl text-[11px] font-bold hover:bg-sky-200 disabled:opacity-50 disabled:cursor-not-allowed transition-all uppercase tracking-wider shadow-sm">Next</button>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <div class="fixed bottom-0 left-0 z-50 w-full h-16 bg-white border-t border-slate-200 md:hidden shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
        <div class="grid h-full max-w-lg grid-cols-5 mx-auto font-medium">
            <button type="button" onclick="window.scrollTo({top: 0, behavior: 'smooth'})" class="inline-flex flex-col items-center justify-center px-5 hover:bg-sky-50 group transition-colors">
                <i class="fas fa-layer-group text-slate-400 mb-1 group-hover:text-sky-600 text-lg transition-colors"></i>
                <span class="text-[9px] text-slate-400 group-hover:text-sky-600 uppercase font-bold tracking-wider">Decks</span>
            </button>
            <button type="button" onclick="document.getElementById('cards-section').scrollIntoView({behavior: 'smooth'})" class="inline-flex flex-col items-center justify-center px-5 hover:bg-sky-50 group transition-colors">
                <i class="fas fa-list text-slate-400 mb-1 group-hover:text-sky-600 text-lg transition-colors"></i>
                <span class="text-[9px] text-slate-400 group-hover:text-sky-600 uppercase font-bold tracking-wider">Cards</span>
            </button>
            <a href="/" class="inline-flex flex-col items-center justify-center px-5 hover:bg-emerald-50 group transition-colors">
                <i class="fas fa-play-circle text-slate-400 mb-1 group-hover:text-emerald-600 text-lg transition-colors"></i>
                <span class="text-[9px] text-slate-400 group-hover:text-emerald-600 uppercase font-bold tracking-wider">App</span>
            </a>
            <a href="/import" class="inline-flex flex-col items-center justify-center px-5 hover:bg-emerald-50 group transition-colors">
                <i class="fas fa-file-import text-slate-400 mb-1 group-hover:text-emerald-600 text-lg transition-colors"></i>
                <span class="text-[9px] text-slate-400 group-hover:text-emerald-600 uppercase font-bold tracking-wider">Import</span>
            </a>
            <button type="button" onclick="logout()" class="inline-flex flex-col items-center justify-center px-5 hover:bg-rose-50 group transition-colors">
                <i class="fas fa-sign-out-alt text-slate-400 mb-1 group-hover:text-rose-600 text-lg transition-colors"></i>
                <span class="text-[9px] text-slate-400 group-hover:text-rose-600 uppercase font-bold tracking-wider">Logout</span>
            </button>
        </div>
    </div>

    <script>
        // State Management Global 
        let globalDecksMap = {};
        let globalCardsMap = {};
        
        let selectedDeckId = null;
        let selectedDeckName = "Semua Deck";
        let isEditingCard = false;

        // --- Variabel State Pagination ---
        let currentPage = 1;
        const itemsPerPage = 5;

        // UI Utils
        function showToast(message, type = 'success') {
            const toast = document.getElementById('custom-toast');
            const toastBg = document.getElementById('toast-bg');
            const toastIcon = document.getElementById('toast-icon');
            document.getElementById('toast-message').innerText = message;
            
            if (type === 'success') {
                toastBg.className = "px-5 py-4 rounded-2xl shadow-xl border bg-emerald-50 border-emerald-200 text-emerald-800 flex items-center gap-3";
                toastIcon.innerHTML = '<i class="fas fa-check-circle text-lg"></i>';
            } else {
                toastBg.className = "px-5 py-4 rounded-2xl shadow-xl border bg-rose-50 border-rose-200 text-rose-800 flex items-center gap-3";
                toastIcon.innerHTML = '<i class="fas fa-exclamation-circle text-lg"></i>';
            }
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.remove('-translate-y-5', 'opacity-0'), 10);
            setTimeout(() => {
                toast.classList.add('-translate-y-5', 'opacity-0');
                setTimeout(() => toast.classList.add('hidden'), 300);
            }, 3000);
        }

        function customConfirm(title, message, callback) {
            const modal = document.getElementById('confirm-modal');
            const box = document.getElementById('confirm-box');
            document.getElementById('confirm-title').innerText = title;
            document.getElementById('confirm-msg').innerText = message;
            modal.classList.remove('hidden');
            setTimeout(() => box.classList.remove('scale-95', 'opacity-0'), 10);
            const close = () => {
                box.classList.add('scale-95', 'opacity-0');
                setTimeout(() => modal.classList.add('hidden'), 200);
            };
            document.getElementById('confirm-cancel-btn').onclick = close;
            document.getElementById('confirm-ok-btn').onclick = () => { close(); callback(); };
        }

        function escapeHTML(str) {
            if(!str) return '';
            return str.toString().replace(/[&<>'"]/g, tag => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            }[tag]));
        }

        async function logout() {
            customConfirm('Keluar Akun?', 'Yakin ingin keluar?', async () => {
                await fetch('/api/auth/logout', { method: 'POST' });
                window.location.href = '/login';
            });
        }

        // ==============================
        // KELOLA DECKS
        // ==============================
        document.getElementById('deck-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const res = await fetch('/api/decks', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: document.getElementById('deck-name').value })
            });
            if(res.ok) {
                showToast('Deck dibuat!', 'success');
                document.getElementById('deck-name').value = '';
                fetchDecks();
            }
        });

        async function fetchDecks() {
            const res = await fetch('/api/decks');
            const decks = await res.json();
            
            globalDecksMap = {};
            decks.forEach(d => globalDecksMap[d.id] = d);
            
            renderDecksList(decks);
            updateDeckDropdowns(decks);
        }

        function renderDecksList(decks) {
            let html = `
                <div onclick="filterDeckBy(null)" class="cursor-pointer flex justify-between items-center p-3 rounded-xl border transition-all ${selectedDeckId === null ? 'bg-sky-600 text-white border-sky-600 font-bold shadow-sm' : 'bg-slate-50 text-slate-700 border-slate-100 hover:bg-sky-100'}">
                    <span class="text-xs"><i class="fas fa-globe mr-2"></i>Tampilkan Semua Deck</span>
                </div>
            `;
            html += decks.map(d => {
                const isActive = selectedDeckId === d.id;
                return `
                    <div onclick="filterDeckBy(${d.id})" class="cursor-pointer flex justify-between items-center p-3 rounded-xl border transition-all ${isActive ? 'bg-sky-600 text-white border-sky-600 font-bold shadow-sm' : 'bg-slate-50 text-slate-700 border-slate-100 hover:bg-sky-50'}">
                        <span class="font-bold text-xs truncate max-w-[140px]"><i class="fas fa-folder ${isActive ? 'text-white' : 'text-sky-300'} mr-2"></i>${escapeHTML(d.name)}</span>
                        <div class="flex gap-3" onclick="event.stopPropagation()">
                            <button onclick="openEditDeckModal(${d.id})" class="${isActive ? 'text-white hover:text-slate-200' : 'text-sky-600 hover:text-sky-800'} transition-colors"><i class="fas fa-pen text-[11px]"></i></button>
                            <button onclick="deleteDeck(${d.id})" class="${isActive ? 'text-white hover:text-red-200' : 'text-rose-500 hover:text-rose-700'} transition-colors"><i class="fas fa-trash text-[11px]"></i></button>
                        </div>
                    </div>
                `;
            }).join('');
            document.getElementById('decks-list').innerHTML = html;
        }

        function updateDeckDropdowns(decks) {
            // Dropdown di Form Tambah/Edit Kartu
            const formSelect = document.getElementById('card-deck-id');
            formSelect.innerHTML = `<option value="" disabled selected>Pilih Wadah Deck...</option>` + 
                decks.map(d => `<option value="${d.id}">${escapeHTML(d.name)}</option>`).join('');
            if (selectedDeckId) formSelect.value = selectedDeckId;

            // Dropdown di Filter Tabel
            const tableSelect = document.getElementById('table-deck-filter');
            tableSelect.innerHTML = `<option value="">🌟 Tampilkan Semua Deck</option>` + 
                decks.map(d => `<option value="${d.id}">${escapeHTML(d.name)}</option>`).join('');
            if (selectedDeckId) {
                tableSelect.value = selectedDeckId;
            } else {
                tableSelect.value = "";
            }
        }

        // Fungsi Sentral Untuk Menangani Perubahan Filter
        function filterDeckBy(deckId) {
            selectedDeckId = deckId;
            selectedDeckName = deckId ? globalDecksMap[deckId].name : "Semua Deck";
            
            document.getElementById('current-deck-label').innerText = selectedDeckName;
            
            // Sinkronkan value di dropdown form dan tabel
            if (deckId) { 
                document.getElementById('card-deck-id').value = deckId; 
                document.getElementById('table-deck-filter').value = deckId;
            } else {
                document.getElementById('table-deck-filter').value = "";
            }
            
            // Reset Pagination jika filter diubah
            currentPage = 1;
            
            fetchDecks(); // Memperbarui warna list active
            renderCardsTable(); // Memperbarui isi tabel
        }

        function openEditDeckModal(id) {
            const deck = globalDecksMap[id];
            document.getElementById('edit-deck-id').value = deck.id;
            document.getElementById('edit-deck-name').value = deck.name;
            document.getElementById('edit-deck-modal').classList.remove('hidden');
        }

        function closeEditDeckModal() { document.getElementById('edit-deck-modal').classList.add('hidden'); }

        async function submitUpdateDeck() {
            const id = document.getElementById('edit-deck-id').value;
            const res = await fetch(`/api/decks/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: document.getElementById('edit-deck-name').value })
            });
            if (res.ok) {
                showToast('Deck diperbarui!', 'success');
                closeEditDeckModal();
                fetchDecks();
                fetchCards();
            }
        }

        async function deleteDeck(id) {
            customConfirm('Hapus Deck?', 'Seluruh materi kanji di deck ini akan terhapus.', async () => {
                const res = await fetch(`/api/decks/${id}`, { method: 'DELETE' });
                if(res.ok) {
                    showToast('Deck dihapus.', 'success');
                    if (selectedDeckId === id) filterDeckBy(null);
                    fetchDecks();
                    fetchCards();
                }
            });
        }

        // ==============================
        // KELOLA KARTU & PAGINATION
        // ==============================
        document.getElementById('card-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('card-edit-id').value;
            const body = {
                deck_id: document.getElementById('card-deck-id').value,
                kanji: document.getElementById('card-kanji').value,
                furigana: document.getElementById('card-furigana').value,
                meaning: document.getElementById('card-meaning').value
            };
            const url = isEditingCard ? `/api/cards/${id}` : '/api/cards';
            const method = isEditingCard ? 'PUT' : 'POST';

            const res = await fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });

            if (res.ok) {
                showToast(isEditingCard ? 'Kartu diperbarui!' : 'Kartu ditambahkan!', 'success');
                // Jika baru nambah data, otomatis kembali ke Halaman 1 agar data baru terlihat di paling atas
                if (!isEditingCard) currentPage = 1; 
                resetCardFormState();
                fetchCards();
            }
        });

        async function fetchCards() {
            const res = await fetch('/api/cards');
            const cards = await res.json();
            
            globalCardsMap = {};
            cards.forEach(c => globalCardsMap[c.id] = c);
            
            renderCardsTable();
        }

        function renderCardsTable() {
            document.getElementById('cards-table-title').innerText = `Isi Deck: ${selectedDeckName}`;
            
            // Konversi dari Object map ke Array dan urutkan ID DESC (Terbaru di atas)
            const allCards = Object.values(globalCardsMap).sort((a, b) => b.id - a.id);
            const filteredCards = selectedDeckId ? allCards.filter(c => c.deck_id === selectedDeckId) : allCards;
            
            // --- Logika Kalkulasi Pagination ---
            const totalItems = filteredCards.length;
            const totalPages = Math.ceil(totalItems / itemsPerPage) || 1;
            
            // Amankan currentPage dari Out of Bounds jika data dihapus habis
            if (currentPage > totalPages) currentPage = totalPages;
            if (currentPage < 1) currentPage = 1;

            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            
            // Potong array data sesuai halamannya
            const paginatedCards = filteredCards.slice(startIndex, endIndex);

            const tbody = document.getElementById('cards-table-body');
            const infoText = document.getElementById('pagination-info');
            const prevBtn = document.getElementById('prev-btn');
            const nextBtn = document.getElementById('next-btn');
            
            if (paginatedCards.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-8 text-center text-slate-400 bg-white rounded-b-xl">Belum ada kartu di wadah ini.</td></tr>`;
                infoText.innerText = "Menampilkan 0 dari 0 data";
                prevBtn.disabled = true;
                nextBtn.disabled = true;
                return;
            }

            // Render isi Tabel yang sudah di-slice
            tbody.innerHTML = paginatedCards.map(c => `
                <tr class="border-b border-slate-50 hover:bg-slate-50/50 transition-colors">
                    <td class="p-3 text-slate-400 font-medium">${c.deck_name ? escapeHTML(c.deck_name) : '<span class="italic text-rose-400">Tanpa Wadah</span>'}</td>
                    <td class="p-3 font-bold text-sky-600 text-sm">${escapeHTML(c.kanji)}</td>
                    <td class="p-3 text-slate-600">${escapeHTML(c.furigana)}</td>
                    <td class="p-3 capitalize text-slate-600">${escapeHTML(c.meaning)}</td>
                    <td class="p-3 text-center">
                        <div class="flex gap-4 justify-center">
                            <button onclick="startEditCard(${c.id})" class="text-sky-500 hover:text-sky-700 transition-colors"><i class="fas fa-edit"></i></button>
                            <button onclick="deleteCard(${c.id})" class="text-rose-400 hover:text-rose-600 transition-colors"><i class="fas fa-trash"></i></button>
                        </div>
                    </td>
                </tr>
            `).join('');

            // Update UI Tombol Navigasi Pagination
            const endDisplay = Math.min(endIndex, totalItems);
            infoText.innerText = `Menampilkan ${startIndex + 1} - ${endDisplay} dari ${totalItems} data`;
            prevBtn.disabled = currentPage === 1;
            nextBtn.disabled = currentPage === totalPages;
        }

        // Fungsi Trigger Navigasi
        function prevPage() {
            if (currentPage > 1) {
                currentPage--;
                renderCardsTable();
            }
        }

        function nextPage() {
            const allCards = Object.values(globalCardsMap);
            const filteredCards = selectedDeckId ? allCards.filter(c => c.deck_id === selectedDeckId) : allCards;
            const totalPages = Math.ceil(filteredCards.length / itemsPerPage);
            
            if (currentPage < totalPages) {
                currentPage++;
                renderCardsTable();
            }
        }

        function startEditCard(id) {
            const card = globalCardsMap[id];
            isEditingCard = true;
            document.getElementById('card-edit-id').value = card.id;
            document.getElementById('card-deck-id').value = card.deck_id || '';
            document.getElementById('card-kanji').value = card.kanji;
            document.getElementById('card-furigana').value = card.furigana;
            document.getElementById('card-meaning').value = card.meaning;

            document.getElementById('card-form-title').innerHTML = '<i class="fas fa-pen-nib text-sky-500 mr-2"></i>Edit Kartu Kanji';
            document.getElementById('card-submit-btn').innerHTML = '<i class="fas fa-sync mr-2"></i> Simpan Perubahan';
            document.getElementById('card-submit-btn').className = "col-span-2 bg-sky-600 hover:bg-sky-700 text-white font-bold py-3.5 rounded-xl text-xs tracking-wider uppercase transition-all shadow-md mt-2";
            document.getElementById('cancel-edit-card-btn').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetCardFormState() {
            isEditingCard = false;
            document.getElementById('card-form').reset();
            document.getElementById('card-edit-id').value = '';
            
            document.getElementById('card-form-title').innerHTML = '<i class="fas fa-clone text-emerald-500 mr-2"></i>Tambah Kartu Baru';
            document.getElementById('card-submit-btn').innerHTML = '<i class="fas fa-save mr-2"></i> Simpan Kartu';
            document.getElementById('card-submit-btn').className = "col-span-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 rounded-xl text-xs tracking-wider uppercase transition-all shadow-md mt-2";
            document.getElementById('cancel-edit-card-btn').classList.add('hidden');
            
            if (selectedDeckId) document.getElementById('card-deck-id').value = selectedDeckId;
        }

        async function deleteCard(id) {
            customConfirm('Hapus Kartu Kanji?', 'Data hafalan untuk kartu ini akan dibuang.', async () => {
                const res = await fetch(`/api/cards/${id}`, { method: 'DELETE' });
                if (res.ok) {
                    showToast('Kartu dihapus.', 'success');
                    fetchCards(); // Akan memicu render ulang tabel dan update posisi halaman
                    if (isEditingCard && document.getElementById('card-edit-id').value == id) resetCardFormState();
                }
            });
        }

        // Init
        fetchDecks();
        fetchCards();
    </script>
</body>
</html>

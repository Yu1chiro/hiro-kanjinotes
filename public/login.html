<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk & Daftar - Kanji SRS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: "Poppins", sans-serif; } </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4 pb-24 md:pb-8">

    <div id="custom-toast" class="fixed top-5 left-1/2 -translate-x-1/2 z-[200] max-w-sm w-11/12 hidden transition-all duration-300 transform -translate-y-5 opacity-0">
        <div id="toast-bg" class="px-5 py-4 rounded-2xl shadow-xl border flex items-center gap-3">
            <span id="toast-icon" class="text-xl"></span>
            <p id="toast-message" class="text-xs font-semibold tracking-wide"></p>
        </div>
    </div>

    <div class="w-full max-w-md bg-white rounded-[2.5rem] shadow-xl border border-slate-100 p-6 sm:p-8 transition-all relative z-10 pb-20 md:pb-8">
        <div class="text-center mb-8">
            <h2 id="auth-title" class="text-2xl font-bold text-slate-800 tracking-tight">SIGNIN</h2>
        </div>

        <form id="auth-form" class="space-y-5">
            <div>
                <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wider block mb-1 ml-1">Username</label>
                <input type="text" id="username" class="w-full bg-slate-50 border border-slate-200 p-4 rounded-2xl focus:border-sky-500 focus:bg-white focus:ring-4 focus:ring-sky-500/10 outline-none transition-all text-sm font-medium" placeholder="Masukkan username anda" required>
            </div>
            <div>
                <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wider block mb-1 ml-1">Password</label>
                <div class="relative">
                    <input type="password" id="password" class="w-full bg-slate-50 border border-slate-200 p-4 pr-12 rounded-2xl focus:border-sky-500 focus:bg-white focus:ring-4 focus:ring-sky-500/10 outline-none transition-all text-sm font-medium" placeholder="••••••••" required>
                    <button type="button" id="toggle-password" class="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-400 hover:text-sky-600 transition-colors focus:outline-none">
                        <i class="fas fa-eye" id="eye-icon"></i>
                    </button>
                </div>
            </div>
            <button type="submit" class="w-full bg-sky-600 hover:bg-sky-700 active:scale-[0.98] text-white font-bold py-4 rounded-2xl transition-all shadow-lg shadow-sky-600/20 text-sm tracking-wide uppercase mt-2">
                SIGNIN
            </button>
        </form>

        <div class="text-center mt-6 pt-4 border-t border-slate-100 text-xs text-slate-500">
            <span id="auth-switch-text">Belum memiliki akun?</span>
            <button onclick="toggleAuthMode()" id="auth-switch-btn" class="text-sky-600 font-bold ml-1 hover:underline outline-none">Daftar</button>
        </div>
    </div>

    <div class="fixed bottom-0 left-0 z-50 w-full h-16 bg-white border-t border-slate-200 md:hidden shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
        <div class="grid h-full max-w-lg grid-cols-3 mx-auto font-medium">
            <a href="/" class="inline-flex flex-col items-center justify-center px-5 hover:bg-sky-50 group transition-colors">
                <i class="fas fa-home text-slate-400 mb-1 group-hover:text-sky-600 text-lg transition-colors"></i>
                <span class="text-[9px] text-slate-400 group-hover:text-sky-600 uppercase font-bold tracking-wider">Home</span>
            </a>
            <a href="/history" class="inline-flex flex-col items-center justify-center px-5 hover:bg-sky-50 group transition-colors">
                <i class="fas fa-history text-slate-400 mb-1 group-hover:text-sky-600 text-lg transition-colors"></i>
                <span class="text-[9px] text-slate-400 group-hover:text-sky-600 uppercase font-bold tracking-wider">History</span>
            </a>
            <a href="/admin" class="inline-flex flex-col items-center justify-center px-5 hover:bg-sky-50 group transition-colors">
                <i class="fas fa-chart-line text-slate-400 mb-1 group-hover:text-sky-600 text-lg transition-colors"></i>
                <span class="text-[9px] text-slate-400 group-hover:text-sky-600 uppercase font-bold tracking-wider">Dashboard</span>
            </a>
        </div>
    </div>

    <script>
        let isLoginMode = true;

        // Toggle Password Visibility Logic
        const togglePasswordBtn = document.getElementById('toggle-password');
        const passwordInput = document.getElementById('password');
        const eyeIcon = document.getElementById('eye-icon');

        togglePasswordBtn.addEventListener('click', () => {
            const isPassword = passwordInput.getAttribute('type') === 'password';
            passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
            
            if (isPassword) {
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
            } else {
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
            }
        });

        function showToast(message, type = 'success') {
            const toast = document.getElementById('custom-toast');
            const toastBg = document.getElementById('toast-bg');
            const toastIcon = document.getElementById('toast-icon');
            const toastMsg = document.getElementById('toast-message');

            toastMsg.innerText = message;
            
            if (type === 'success') {
                toastBg.className = "px-5 py-4 rounded-2xl shadow-xl border bg-emerald-50 border-emerald-200 text-emerald-800 flex items-center gap-3";
                toastIcon.innerText = "✨";
            } else {
                toastBg.className = "px-5 py-4 rounded-2xl shadow-xl border bg-rose-50 border-rose-200 text-rose-800 flex items-center gap-3";
                toastIcon.innerText = "🚨";
            }

            toast.classList.remove('hidden');
            setTimeout(() => {
                toast.classList.remove('-translate-y-5', 'opacity-0');
            }, 10);

            setTimeout(() => {
                toast.classList.add('-translate-y-5', 'opacity-0');
                setTimeout(() => toast.classList.add('hidden'), 300);
            }, 3000);
        }

        function toggleAuthMode() {
            isLoginMode = !isLoginMode;
            document.getElementById('auth-title').innerText = isLoginMode ? "SIGNIN" : "REGISTER";
            document.getElementById('auth-switch-text').innerText = isLoginMode ? "Belum memiliki akun?" : "Sudah memiliki akun?";
            document.getElementById('auth-switch-btn').innerText = isLoginMode ? "Daftar" : "Masuk";
            document.getElementById('auth-form').querySelector('button[type="submit"]').innerText = isLoginMode ? "SIGNIN" : "REGISTER";
        }

        document.getElementById('auth-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const endpoint = isLoginMode ? '/api/auth/login' : '/api/auth/register';

            try {
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();

                if (res.ok) {
                    showToast(data.message, 'success');
                    if (!isLoginMode) {
                        toggleAuthMode();
                    } else {
                        // Redirect langsung ke /admin setelah login sukses
                        setTimeout(() => window.location.href = '/admin', 1000);
                    }
                } else {
                    showToast(data.message || 'Terjadi kesalahan sistem.', 'error');
                }
            } catch (err) {
                showToast('Gagal terhubung ke server.', 'error');
            }
        });
    </script>
</body>
</html>

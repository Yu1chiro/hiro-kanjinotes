<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Import JSON - Kanji SRS</title>
    <!-- Favicon -->
    <link rel="shortcut icon" href="https://ik.imagekit.io/yuidev25/Hera?updatedAt=1781458984059" type="image/x-icon">
    
    <!-- Menggunakan Tailwind CSS versi 3 sesuai instruksi -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style> 
        body { font-family: "Poppins", sans-serif; } 
        /* Animasi loading bar */
        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 pb-24 md:pb-12">
    
    <!-- Toast Notification (Pesan Alert) -->
    <div id="custom-toast" class="fixed top-5 left-1/2 -translate-x-1/2 z-[200] max-w-sm w-11/12 hidden transition-all duration-300 transform -translate-y-5 opacity-0">
        <div id="toast-bg" class="px-5 py-4 rounded-2xl shadow-xl border flex items-center gap-3">
            <span id="toast-icon" class="text-xl"></span>
            <p id="toast-message" class="text-xs font-semibold tracking-wide"></p>
        </div>
    </div>

    <!-- Navbar Atas -->
    <nav class="bg-white border-b border-slate-100 sticky top-0 z-50">
        <div class="container mx-auto px-4 py-4 max-w-5xl flex justify-between items-center">
            <div class="flex items-center gap-2">
                <img src="https://ik.imagekit.io/yuidev25/Hera?updatedAt=1781458984059" class="w-10 h-auto" alt="Logo">
                <span class="text-sm font-black text-slate-800 tracking-tight uppercase">IMPORT DATA</span>
            </div>
            <div class="flex items-center gap-3">
                <a href="/admin" class="text-xs font-bold text-slate-600 hover:text-slate-800 uppercase tracking-wider bg-slate-100 px-4 py-2 rounded-xl transition-all"><i class="fas fa-arrow-left mr-1"></i> Kembali</a>
            </div>
        </div>
    </nav>

    <!-- Kontainer Utama -->
    <div class="container mx-auto p-4 max-w-3xl mt-6">
        <div class="bg-white p-6 md:p-8 rounded-[2rem] border border-slate-100 shadow-sm">
            <div class="border-b border-slate-50 pb-4 mb-6 text-center sm:text-left">
                <h2 class="text-xl font-bold text-slate-800 uppercase tracking-wider"><i class="fas fa-file-import text-sky-500 mr-2"></i> Import Kanji via JSON</h2>
                <p class="text-xs text-slate-400 mt-2">Masukkan data JSON Anda atau upload file .json untuk menambah banyak kosakata sekaligus ke dalam Database.</p>
                <p class="text-xs text-slate-400 mt-1">Gunakan note berikut untuk mencatat kanji :
                    <a href="https://seamless-notes.vercel.app" target="_blank" class="text-sky-600 hover:font-bold">Seamless Notes</a>
                </p>
            </div>

            <form id="import-form" class="space-y-6">
                <!-- Dropdown Pilih Deck -->
                <div class="bg-sky-50 border border-sky-100 p-4 rounded-xl">
                    <label class="text-[10px] font-bold text-sky-700 uppercase tracking-wider block mb-2 ml-1">1. Pilih Wadah Deck</label>
                    <select id="deck-id" class="w-full bg-white border border-slate-200 p-4 rounded-xl text-sm outline-none focus:border-sky-500 font-medium cursor-pointer shadow-sm" required>
                        <option value="" disabled selected>Memuat deck...</option>
                    </select>
                </div>

                <!-- Opsi File Upload -->
                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-2 ml-1">2. Upload File JSON (Opsional)</label>
                    <input type="file" id="json-file" accept=".json" class="w-full bg-slate-50 border border-slate-200 p-3 rounded-xl text-xs outline-none focus:border-sky-500 font-medium file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-bold file:bg-sky-100 file:text-sky-700 hover:file:bg-sky-200 cursor-pointer transition-all">
                </div>

                <!-- Textarea JSON -->
                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-2 ml-1">Atau Paste Data JSON Disini</label>
                    <textarea id="json-text" rows="12" class="w-full bg-slate-50 border border-slate-200 p-4 rounded-xl text-xs font-mono outline-none focus:border-sky-500 leading-relaxed" placeholder='[\n  {\n    "kanji": "台所",\n    "furigana": "だいどころ",\n    "arti": "Dapur"\n  }\n]' required></textarea>
                </div>

                <!-- Tombol Submit -->
                <button type="submit" id="submit-btn" class="w-full bg-emerald-600 hover:bg-emerald-700 active:scale-[0.99] text-white font-bold py-4 rounded-xl text-sm tracking-wider uppercase transition-all shadow-md mt-2 flex justify-center items-center">
                    <i class="fas fa-cloud-upload-alt mr-2"></i> Mulai Import Data
                </button>
            </form>

            <!-- Tampilan Progress Bar (Akan muncul saat import berjalan) -->
            <div id="progress-container" class="hidden mt-6 bg-slate-50 p-5 rounded-xl border border-slate-100">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-xs font-bold text-slate-600" id="progress-text">Proses: 0 / 0</span>
                    <span class="text-[10px] font-bold px-2 py-1 bg-sky-100 text-sky-700 rounded-lg uppercase" id="progress-percent">0%</span>
                </div>
                <div class="w-full bg-slate-200 rounded-full h-3 overflow-hidden">
                    <div class="bg-sky-500 h-3 rounded-full transition-all duration-300 relative overflow-hidden" id="progress-bar" style="width: 0%">
                        <!-- Efek cahaya kilap pada bar -->
                        <div class="absolute inset-0 bg-white/20 w-full animate-[shimmer_1s_infinite]"></div>
                    </div>
                </div>
                <p id="progress-detail" class="text-[10px] text-slate-400 mt-2 text-center"></p>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. FUNGSI UTILITIES
        // ==========================================
        
        // Fungsi untuk memunculkan pesan alert (Toast)
        function showToast(message, type = 'success') {
            const toast = document.getElementById('custom-toast');
            const toastBg = document.getElementById('toast-bg');
            const toastIcon = document.getElementById('toast-icon');
            document.getElementById('toast-message').innerText = message;
            
            if (type === 'success') {
                toastBg.className = "px-5 py-4 rounded-2xl shadow-xl border bg-emerald-50 border-emerald-200 text-emerald-800 flex items-center gap-3";
                toastIcon.innerHTML = '<i class="fas fa-check-circle text-lg"></i>';
            } else {
                toastBg.className = "px-5 py-4 rounded-2xl shadow-xl border bg-rose-50 border-rose-200 text-rose-800 flex items-center gap-3";
                toastIcon.innerHTML = '<i class="fas fa-exclamation-circle text-lg"></i>';
            }
            
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.remove('-translate-y-5', 'opacity-0'), 10);
            setTimeout(() => {
                toast.classList.add('-translate-y-5', 'opacity-0');
                setTimeout(() => toast.classList.add('hidden'), 300);
            }, 4000);
        }

        document.addEventListener('DOMContentLoaded', async () => {
            
            // ==========================================
            // 2. MENGAMBIL DAFTAR DECK DARI BACKEND
            // ==========================================
            try {
                const res = await fetch('/api/decks');
                if (res.ok) {
                    const decks = await res.json();
                    const select = document.getElementById('deck-id');
                    
                    // Masukkan daftar deck ke dalam elemen dropdown <select>
                    select.innerHTML = '<option value="" disabled selected>Pilih Deck Tujuan...</option>' + 
                        decks.map(d => `<option value="${d.id}">${d.name}</option>`).join('');
                } else {
                    throw new Error('Gagal memuat deck');
                }
            } catch (err) {
                showToast('Pastikan Anda sudah login untuk melihat deck.', 'error');
            }

            // ==========================================
            // 3. LOGIKA MEMBACA FILE UPLOAD
            // ==========================================
            document.getElementById('json-file').addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (!file) return;
                
                const reader = new FileReader();
                reader.onload = function(evt) {
                    try {
                        // Pastikan isi file benar-benar JSON yang valid
                        JSON.parse(evt.target.result);
                        document.getElementById('json-text').value = evt.target.result;
                        showToast('File JSON berhasil dimuat ke kotak teks.', 'success');
                    } catch (e) {
                        showToast('Isi file bukan JSON yang valid!', 'error');
                    }
                };
                reader.readAsText(file); // Mulai membaca file
            });

            // ==========================================
            // 4. LOGIKA TOMBOL SUBMIT (PROSES IMPORT)
            // ==========================================
            document.getElementById('import-form').addEventListener('submit', async (e) => {
                e.preventDefault(); // Mencegah halaman refresh
                
                const submitBtn = document.getElementById('submit-btn');
                const deckId = document.getElementById('deck-id').value;
                const jsonText = document.getElementById('json-text').value;
                
                try {
                    // Cek apakah format JSON yang dipaste valid
                    const parsedData = JSON.parse(jsonText);
                    if (!Array.isArray(parsedData)) {
                        throw new Error('Format harus berupa Array [...]. Cek kembali JSON Anda.');
                    }

                    // Ubah tombol jadi status "Loading"
                    submitBtn.disabled = true;
                    submitBtn.classList.add('opacity-70', 'cursor-not-allowed');
                    submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Sedang Mengimport...';
                    
                    // Tampilkan UI Progress Bar
                    const progressContainer = document.getElementById('progress-container');
                    const progressBar = document.getElementById('progress-bar');
                    const progressText = document.getElementById('progress-text');
                    const progressPercent = document.getElementById('progress-percent');
                    const progressDetail = document.getElementById('progress-detail');
                    
                    progressContainer.classList.remove('hidden');
                    
                    let successCount = 0;
                    let errorCount = 0;
                    const total = parsedData.length;

                    // Lakukan perulangan, kirim data SATU PER SATU ke API /api/cards
                    for (let i = 0; i < total; i++) {
                        const item = parsedData[i];
                        
                        // Menangani penamaan key yang berbeda (bisa 'arti' dari JSON Anda, diterjemahkan ke 'meaning' untuk DB)
                        const meaning = item.arti || item.meaning || '';
                        
                        if (!item.kanji || !item.furigana || !meaning) {
                            errorCount++; // Jika datanya bolong, hitung sebagai gagal
                        } else {
                            // Tembak API layaknya form penambahan satu kartu di backend Anda
                            const res = await fetch('/api/cards', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    deck_id: deckId,
                                    kanji: item.kanji,
                                    furigana: item.furigana,
                                    meaning: meaning
                                })
                            });
                            
                            if (res.ok) successCount++;
                            else errorCount++;
                        }

                        // Update tampilan persentase progress bar
                        const percent = Math.round(((i + 1) / total) * 100);
                        progressBar.style.width = `${percent}%`;
                        progressPercent.innerText = `${percent}%`;
                        progressText.innerText = `Proses: ${i + 1} / ${total}`;
                        progressDetail.innerText = `Berhasil: ${successCount} | Gagal: ${errorCount}`;
                    }
                    
                    // Setelah seluruh perulangan selesai
                    showToast(`Selesai! ${successCount} data berhasil ditambahkan.`, successCount > 0 ? 'success' : 'error');
                    submitBtn.innerHTML = '<i class="fas fa-check-circle mr-2"></i> Selesai';
                    
                    // Arahkan kembali ke halaman dashboard (admin) setelah sukses
                    if (successCount > 0) {
                        setTimeout(() => {
                            window.location.href = '/admin';
                        }, 2000);
                    } else {
                        // Jika gagal semua, kembalikan tombol
                        submitBtn.disabled = false;
                        submitBtn.classList.remove('opacity-70', 'cursor-not-allowed');
                        submitBtn.innerHTML = '<i class="fas fa-cloud-upload-alt mr-2"></i> Coba Lagi';
                    }

                } catch (err) {
                    showToast(err.message || 'JSON tidak valid. Cek kembali format penulisan.', 'error');
                    submitBtn.disabled = false;
                    submitBtn.classList.remove('opacity-70', 'cursor-not-allowed');
                    submitBtn.innerHTML = '<i class="fas fa-cloud-upload-alt mr-2"></i> Mulai Import Data';
                }
            });
        });
    </script>
</body>
</html>

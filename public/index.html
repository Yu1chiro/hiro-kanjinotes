<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>しか Welcome</title>
    <link rel="shortcut icon" href="https://i.pinimg.com/736x/17/f3/67/17f36740a0ecca7d55b7c04a37862748.jpg" type="image/x-icon">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: "Poppins", "Noto Sans JP", sans-serif !important; }
        .glass-morphism { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .floating-chart { position: fixed; bottom: 20px; right: 20px; z-index: 50; }
    </style>
</head>
<body style="background-image: url('https://i.pinimg.com/736x/aa/ee/68/aaee68824e62a64f58d63b5545a905a7.jpg');" class="relative min-h-screen bg-cover bg-fixed bg-center text-slate-800">
    <div class="absolute inset-0 bg-slate-900/40 fixed"></div>

    <div id="goals-modal" class="fixed inset-0 z-[100] hidden flex items-center justify-center p-4 bg-black/70 backdrop-blur-md">
        <div class="bg-white rounded-[2.5rem] p-8 max-w-md w-full shadow-2xl border border-white/20 animate-in fade-in zoom-in duration-300">
            <div class="flex items-center gap-3 mb-6">
                <div class="w-2 h-6 bg-yellow-400 rounded-full"></div>
                <h2 class="text-xl font-bold text-slate-800">Set Your Goals</h2>
            </div>
            <div class="space-y-5">
                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase ml-2 tracking-widest">Target Jumlah Kanji</label>
                    <input type="number" id="goal-target" class="w-full bg-slate-50 border-2 border-slate-100 p-4 rounded-2xl focus:border-sky-500 outline-none transition-all font-bold" placeholder="Misal: 100">
                </div>
                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase ml-2 tracking-widest">Reward Jika Tercapai</label>
                    <textarea id="goal-reward" rows="3" class="w-full bg-slate-50 border-2 border-slate-100 p-4 rounded-2xl focus:border-sky-500 outline-none transition-all text-sm italic" placeholder="Misal: Beli sushi enak..."></textarea>
                </div>
                <div class="flex gap-3 pt-2">
                    <button id="save-goals" class="flex-grow bg-sky-600 hover:bg-sky-700 text-white text-[11px] font-bold py-4 rounded-2xl transition-all active:scale-95 shadow-lg uppercase tracking-widest">Simpan & Mulai</button>
                    <button id="skip-goals" class="bg-slate-100 text-slate-500 text-[11px] font-bold py-4 px-6 rounded-2xl hover:bg-slate-200 transition-all uppercase tracking-widest">Nanti</button>
                </div>
            </div>
        </div>
    </div>

    <div id="floating-widget" class="floating-chart group hidden">
        <div class="glass-morphism p-4 rounded-[2rem] shadow-2xl border border-white/40 flex flex-col items-center justify-center transition-all hover:scale-105 active:scale-95 cursor-pointer">
            <div class="relative w-16 h-16 flex items-center justify-center">
                <svg class="w-full h-full -rotate-90">
                    <circle cx="32" cy="32" r="28" stroke="currentColor" stroke-width="5" fill="transparent" class="text-slate-200" />
                    <circle id="progress-circle" cx="32" cy="32" r="28" stroke="currentColor" stroke-width="5" fill="transparent" stroke-dasharray="175.9" stroke-dashoffset="175.9" class="text-sky-500 transition-all duration-1000" />
                </svg>
                <span id="goal-percent" class="absolute text-[10px] font-black text-slate-700">0%</span>
            </div>
        </div>
    </div>

    <div id="reward-modal" class="fixed inset-0 z-[110] hidden flex items-center justify-center p-4 bg-black/80 backdrop-blur-md">
        <div class="bg-white rounded-[3rem] p-8 max-w-sm w-full text-center shadow-2xl border-4 border-yellow-400">
            <div class="text-6xl mb-4 animate-bounce">🎁</div>
            <h2 class="text-2xl font-black text-slate-800 mb-2 uppercase">Target Tercapai!</h2>
            <p id="reward-display" class="bg-yellow-50 text-yellow-700 font-bold p-4 rounded-2xl border-2 border-yellow-200 my-6 italic"></p>
            <button id="close-reward" class="w-full bg-slate-800 text-white font-bold py-4 rounded-2xl hover:bg-black transition-all">SAYA SUDAH TERIMA</button>
        </div>
    </div>

    <div id="custom-toast" class="fixed top-10 left-1/2 -translate-x-1/2 z-[150] hidden transition-all duration-300 transform -translate-y-5 opacity-0">
        <div class="bg-green-600 text-white px-6 py-4 rounded-[2rem] shadow-2xl border-2 border-white/20 backdrop-blur-md">
            <span id="toast-message" class="text-xs font-bold uppercase tracking-wider"></span>
        </div>
    </div>

    <div class="relative z-10">
        <div class="container mx-auto p-4 md:p-8 max-w-4xl pb-24 md:pb-8">
            <header class="text-center mb-8 pt-4">
                <h1 class="text-3xl font-extrabold text-white tracking-tight drop-shadow-md">漢字ログエラー</h1>
                <p class="text-white/80 mt-2 text-xs md:text-sm font-medium tracking-wide uppercase italic">Error Log for Kanji JLPT Learning</p>
            </header>
        
            <section id="stats-section" class="mb-10 glass-morphism p-6 rounded-[2.5rem] shadow-2xl border border-white/20">
                <div class="flex items-center gap-3 mb-6">
                    <div class="w-2 h-6 bg-sky-500 rounded-full"></div>
                    <h2 class="text-lg font-bold text-slate-700">Daily Performance</h2>
                </div>
                <div class="grid grid-cols-2 md:grid-cols-3 gap-4 text-center">
                    <div class="p-4 rounded-3xl bg-slate-50 border border-slate-100">
                        <p class="text-2xl font-black text-sky-600" id="weeks-completed">0 / 0</p>
                        <p class="text-[9px] font-bold text-slate-400 uppercase tracking-tighter mt-1">Weeks</p>
                    </div>
                    <div class="p-4 rounded-3xl bg-slate-50 border border-slate-100">
                        <p class="text-2xl font-black text-green-500" id="kanji-mastered">0 / 0</p>
                        <p class="text-[9px] font-bold text-slate-400 uppercase tracking-tighter mt-1">Mastery</p>
                    </div>
                    <div class="col-span-2 md:col-span-1 flex flex-col gap-2">
                        <button onclick="window.location.href='/history'" class="w-full bg-slate-800 hover:bg-black text-white text-[10px] font-bold py-3 rounded-2xl shadow-lg">RIWAYAT</button>
                        <button id="reset-progress" class="w-full bg-red-50 text-red-500 text-[10px] font-bold py-3 rounded-2xl">RESET</button>
                    </div>
                </div>
            </section>
        
            <main>
                <div id="weeks-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 md:gap-6"></div>
            </main>
        </div>
    </div>
    <div class="fixed bottom-0 left-0 z-50 w-full h-16 bg-white border-t border-slate-200 md:hidden shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
        <div class="grid h-full max-w-lg grid-cols-3 mx-auto font-medium">
            <a href="/" class="inline-flex flex-col items-center justify-center px-5 hover:bg-sky-50 group transition-colors">
                <i class="fas fa-home text-slate-400 mb-1 group-hover:text-sky-600 text-lg transition-colors"></i>
                <span class="text-[9px] text-slate-400 group-hover:text-sky-600 uppercase font-bold tracking-wider">Home</span>
            </a>
            <a href="/history" class="inline-flex flex-col items-center justify-center px-5 hover:bg-sky-50 group transition-colors">
                <i class="fas fa-history text-slate-400 mb-1 group-hover:text-sky-600 text-lg transition-colors"></i>
                <span class="text-[9px] text-slate-400 group-hover:text-sky-600 uppercase font-bold tracking-wider">History</span>
            </a>
            <a href="/admin" class="inline-flex flex-col items-center justify-center px-5 hover:bg-sky-50 group transition-colors">
                <i class="fas fa-chart-line text-slate-400 mb-1 group-hover:text-sky-600 text-lg transition-colors"></i>
                <span class="text-[9px] text-slate-400 group-hover:text-sky-600 uppercase font-bold tracking-wider">Dashboard</span>
            </a>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const KANJI_PER_WEEK = 10;
            const weeksGrid = document.getElementById('weeks-grid');
            const weeksCompletedEl = document.getElementById('weeks-completed');
            const kanjiMasteredEl = document.getElementById('kanji-mastered');
            const resetProgressBtn = document.getElementById('reset-progress');
            
            const goalsModal = document.getElementById('goals-modal');
            const targetInput = document.getElementById('goal-target');
            const rewardInput = document.getElementById('goal-reward');
            const saveGoalsBtn = document.getElementById('save-goals');
            const skipGoalsBtn = document.getElementById('skip-goals');
            const floatingWidget = document.getElementById('floating-widget');
            const progressCircle = document.getElementById('progress-circle');
            const goalPercentEl = document.getElementById('goal-percent');
            const rewardModal = document.getElementById('reward-modal');
            const rewardDisplay = document.getElementById('reward-display');
            const closeRewardBtn = document.getElementById('close-reward');

            let totalWeeks = 0;
            let totalKanji = 0;

            const progress = JSON.parse(localStorage.getItem('kanjiProgress')) || {};
            const srsData = JSON.parse(localStorage.getItem('kanjiSRSData')) || {};
            let goalData = JSON.parse(localStorage.getItem('kanjiGoalData')) || { target: 0, reward: "", achieved: false };

            if (goalData.target === 0) { goalsModal.classList.remove('hidden'); } 
            else { floatingWidget.classList.remove('hidden'); }

            targetInput.value = goalData.target || "";
            rewardInput.value = goalData.reward || "";

            function updateStats() {
                const completedCount = Object.values(progress).filter(Boolean).length;
                const masteredCount = completedCount * KANJI_PER_WEEK;
                weeksCompletedEl.textContent = `${completedCount} / ${totalWeeks}`;
                kanjiMasteredEl.textContent = `${masteredCount} / ${totalKanji}`;

                if (goalData.target > 0) {
                    const percent = Math.min(Math.round((masteredCount / goalData.target) * 100), 100);
                    goalPercentEl.textContent = `${percent}%`;
                    const offset = 175.9 - (percent / 100 * 175.9);
                    progressCircle.style.strokeDashoffset = offset;

                    if (masteredCount >= goalData.target && !goalData.achieved && goalData.reward !== "") {
                        rewardDisplay.textContent = goalData.reward;
                        rewardModal.classList.remove('hidden');
                        goalData.achieved = true;
                        localStorage.setItem('kanjiGoalData', JSON.stringify(goalData));
                    }
                }
            }

            saveGoalsBtn.onclick = () => {
                const target = parseInt(targetInput.value);
                const reward = rewardInput.value.trim();
                if (isNaN(target) || target <= 0) { showToast("Masukkan target angka!"); return; }
                goalData = { target, reward, achieved: false };
                localStorage.setItem('kanjiGoalData', JSON.stringify(goalData));
                goalsModal.classList.add('hidden');
                floatingWidget.classList.remove('hidden');
                updateStats();
                showToast("Target berhasil disimpan!");
            };

            skipGoalsBtn.onclick = () => goalsModal.classList.add('hidden');
            floatingWidget.onclick = () => goalsModal.classList.remove('hidden');
            closeRewardBtn.onclick = () => rewardModal.classList.add('hidden');

            function showToast(message) {
                const toast = document.getElementById('custom-toast');
                document.getElementById('toast-message').textContent = message;
                toast.classList.remove('hidden');
                setTimeout(() => toast.classList.remove('-translate-y-5', 'opacity-0'), 10);
                setTimeout(() => {
                    toast.classList.add('-translate-y-5', 'opacity-0');
                    setTimeout(() => toast.classList.add('hidden'), 300);
                }, 3000);
            }

            async function renderWeeks() {
                weeksGrid.innerHTML = '';
                const now = new Date();
                for (let i = 1; i <= totalWeeks; i++) {
                    const isCompleted = progress[i]; // Cek apakah kuis sudah selesai
                    const card = document.createElement('div');
                    let statusHTML = '<p class="text-[9px] font-bold text-slate-300 mt-3 uppercase">Mulai</p>';
                    let checkmark = '';
                    let isLocked = false;
                    let lockReason = "";

                    try {
                        const res = await fetch(`/api/kanji/week/${i}`);
                        const data = await res.json();
                        const sampleKanji = data.kanjiData[0].kanji;
                        const info = srsData[sampleKanji];

                        if (info) {
                            const nextDate = new Date(info.nextReview);
                            const diffMs = nextDate - now;
                            // FIX: Hanya lock jika quiz sudah SELESAI (isCompleted) DAN waktu review masih lama
                            if (isCompleted && diffMs > 0) { 
                                isLocked = true;
                                const diffHrs = Math.floor(diffMs / (1000 * 60 * 60));
                                lockReason = diffHrs > 24 ? `${Math.ceil(diffMs / (1000 * 60 * 60 * 24))} hari lagi` : `${diffHrs} jam lagi`;
                                statusHTML = `<p class="text-[9px] font-bold text-amber-500 mt-3 uppercase">Locked: ${lockReason}</p>`;
                            } else if (diffMs <= 0) {
                                statusHTML = '<p class="text-[9px] font-black text-red-500 mt-3 animate-pulse uppercase">Review Now!</p>';
                            }
                        }
                    } catch(e) {}

                    if (isCompleted) checkmark = `<div class="absolute top-4 right-4 bg-green-500 text-white rounded-full p-1 shadow-lg ring-4 ring-green-50"><svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg></div>`;
                    
                    const lockOverlay = isLocked ? 'grayscale opacity-60 cursor-not-allowed' : 'hover:shadow-2xl hover:-translate-y-2 cursor-pointer';
                    card.className = `group relative p-6 bg-white rounded-[2rem] shadow-xl border border-slate-100 transition-all duration-300 flex flex-col items-center justify-center aspect-square ${lockOverlay}`;
                    card.innerHTML = `${checkmark} ${isLocked ? '<div class="absolute inset-0 flex items-center justify-center z-20 text-red-600"><svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" /></svg></div>' : ''} <div class="text-center ${isLocked ? 'blur-[1px]' : ''}"> <p class="text-slate-400 text-[10px] font-bold uppercase mb-1">Day</p> <p class="text-5xl font-black text-slate-800 group-hover:text-sky-600 transition-colors">${i}</p> ${statusHTML} </div>`;

                    if (!isLocked) card.onclick = () => window.location.href = `/study-mode?week=${i}`;
                    else card.onclick = () => showToast(`Kembali dalam ${lockReason}!`);
                    weeksGrid.appendChild(card);
                }
            }

            fetch('/api/kanji/week/1').then(res => res.json()).then(data => {
                totalWeeks = data.totalWeeks; totalKanji = data.totalKanji;
                updateStats(); renderWeeks();
            });

            resetProgressBtn.addEventListener('click', () => {
                if (confirm('Hapus seluruh progress?')) { localStorage.clear(); location.reload(); }
            });
        });
    </script>
</body>
</html>
